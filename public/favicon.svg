<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gauge gradient: artisan (green) → mid (amber) → slop (rose) -->
    <linearGradient id="g" x1="96" y1="0" x2="416" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#09090b"/>

  <!--
    Gauge: semicircle from (96,330) [left/"artisan"] to (416,330) [right/"slop machine"] via top (256,170)
    Center (256,330), radius 160. Matches app's polarToCartesian + describeArc(Math.PI, 0).
  -->

  <!-- Track (dim background arc) -->
  <path
    d="M 96,330 A 160,160 0 0 1 416,330"
    fill="none"
    stroke="#1f1f23"
    stroke-width="28"
    stroke-linecap="round"
  />

  <!--
    Filled arc at 80% slop score.
    80% → endAngle = Math.PI - 0.8*Math.PI = 0.2π = 36°
    end = (256 + 160·cos36°, 330 - 160·sin36°) = (385.4, 235.9)
    largeArc = π - 0.2π > π? → false → 0
  -->
  <path
    d="M 96,330 A 160,160 0 0 1 385.4,235.9"
    fill="none"
    stroke="url(#g)"
    stroke-width="28"
    stroke-linecap="round"
  />

  <!--
    Needle at 80% position (same angle 0.2π = 36°), 85% of radius = 136
    tip = (256 + 136·cos36°, 330 - 136·sin36°) = (366.0, 250.1)
  -->
  <line x1="256" y1="330" x2="366" y2="250" stroke="#fb7185" stroke-width="12" stroke-linecap="round"/>

  <!-- Pivot dot -->
  <circle cx="256" cy="330" r="20" fill="#fb7185"/>
</svg>
